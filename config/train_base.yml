# FragDiff CrossDock pocket10 LMDB training configuration

exp_name: fragdiff_crossdocked_pocket10_lmdb
device: gpu
seed: 42

data: data
train_data_prefix: crossdocked_pocket10
val_data_prefix: crossdocked_pocket10
dataset: crossdock

model: egnn_dynamics
n_layers: 6
nf: 128
attention: true
tanh: true
activation: silu
normalization: batch_norm
aggregation_method: sum
normalization_factor: 1.0
inv_sublayers: 1
norm_constant: 1.0
sin_embedding: false
no_wandb: true

diffusion_steps: 500
diffusion_noise_schedule: cosine
diffusion_noise_precision: 1.0e-5
diffusion_loss_type: l2

n_epochs: 200
batch_size: 16
lr: 0.00005
gradient_clip_val: 1.0
test_epochs: 10
n_stability_samples: 500

data_augmentation: false
center_of_mass: fragments
inpainting: false
remove_anchors_context: false
include_charges: true

graph_type: FC
normalize_factors: [1, 4, 1]

checkpoints: checkpoints
logs: logs
log_iterations: 20
enable_progress_bar: true

num_workers: 0
ema_decay: 0.999
