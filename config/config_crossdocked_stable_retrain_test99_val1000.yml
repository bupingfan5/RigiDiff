# Full retraining configuration with a fixed 1,000-record validation split.
# Start this run from random initialization; do not use --resume or init_checkpoint.

exp_name: crossdocked_stable_retrain_test99_val1000
run_name: run12_crossdocked_stable_retrain_val1000
device: gpu
seed: 42

data: data
train_data_prefix: crossdocked_pocket10_test99_v2
val_data_prefix: crossdocked_pocket10_test99_v2
split_file: data/crossdocked_pocket10_test99_val1000_fixed_split.pt
fragment_vocab_path: data/crossdocked_pocket10_fragment_vocab.pt
dataset: crossdock

model: egnn_dynamics
n_layers: 6
nf: 128
attention: true
tanh: true
activation: silu
normalization: batch_norm
aggregation_method: sum
normalization_factor: 1.0
inv_sublayers: 1
norm_constant: 1.0
sin_embedding: false
no_wandb: true

diffusion_steps: 500
diffusion_noise_schedule: cosine
diffusion_noise_precision: 1.0e-5
diffusion_loss_type: l2

n_epochs: 200
batch_size: 4
accumulate_grad_batches: 4
precision: 32
lr: 1.0e-5
weight_decay: 1.0e-5
ema_decay: 0.9999
lr_scheduler: warmup_cosine
warmup_fraction: 0.05
warmup_start_lr_ratio: 0.05
min_lr_ratio: 0.05
gradient_clip_val: 0.5

lambda_pocket_clash: 1.0
lambda_contact: 0.1
lambda_attach: 1.0
lambda_connectivity: 0.2
lambda_gf: 0.5
bond_class_weights_file: data/crossdocked_pocket10_bond_class_weights.json

corrective_freeze_epochs: 0
pocket_encoder_lr_multiplier: 1.0
bond_head_lr_multiplier: 1.0
rigid_head_lr_multiplier: 1.0
clash_warmup_epochs: 20

save_all_checkpoints: true
checkpoint_every_n_epochs: 10
early_stopping_patience: 0

data_augmentation: false
center_of_mass: fragments
inpainting: false
remove_anchors_context: false
include_charges: true
graph_type: FC
normalize_factors: [1, 4, 1]

checkpoints: checkpoints
logs: logs
log_iterations: 20
test_epochs: 10
n_stability_samples: 500
enable_progress_bar: true
num_workers: 0
