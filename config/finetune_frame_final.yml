exp_name: frame_consistent_corrective_finetune
run_name: run8_framefix_hfix
device: gpu
seed: 42

data: data
train_data_prefix: crossdocked_pocket10
val_data_prefix: crossdocked_pocket10
dataset: crossdock

model: egnn_dynamics
n_layers: 6
nf: 128
attention: true
tanh: true
activation: silu
normalization: batch_norm
aggregation_method: sum
normalization_factor: 1.0
inv_sublayers: 1
norm_constant: 1.0
sin_embedding: false
no_wandb: true

diffusion_steps: 500
diffusion_noise_schedule: cosine
diffusion_noise_precision: 1.0e-5
diffusion_loss_type: l2

n_epochs: 6
batch_size: 8
accumulate_grad_batches: 2
precision: 16
lr: 5.0e-6
gradient_clip_val: 1.0

lambda_pocket_clash: 1.0
lambda_contact: 0.1
lambda_attach: 1.0
lambda_connectivity: 0.2
lambda_gf: 0.5
bond_class_weights_file: data/crossdocked_pocket10_bond_class_weights.json
corrective_freeze_epochs: 2
pocket_encoder_lr_multiplier: 2.0
bond_head_lr_multiplier: 2.0
rigid_head_lr_multiplier: 20.0
clash_warmup_epochs: 1

init_checkpoint: checkpoints/run7_stable/run7_stable_epoch=11.ckpt
reset_rotation_output: true
save_all_checkpoints: true
early_stopping_patience: 0

data_augmentation: false
center_of_mass: fragments
inpainting: false
remove_anchors_context: false
include_charges: true
graph_type: FC
normalize_factors: [1, 4, 1]

checkpoints: checkpoints
logs: logs
log_iterations: 20
test_epochs: 1
enable_progress_bar: true
num_workers: 0
