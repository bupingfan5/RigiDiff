exp_name: crossdocked_retrain_test99_v2
run_name: run10_crossdocked_retrain
device: gpu
seed: 42

data: data
train_data_prefix: crossdocked_pocket10_test99_v2
val_data_prefix: crossdocked_pocket10_test99_v2
split_file: data/crossdocked_pocket10_test99_split.pt
fragment_vocab_path: data/crossdocked_pocket10_fragment_vocab.pt
dataset: crossdock

model: egnn_dynamics
n_layers: 6
nf: 128
attention: true
tanh: true
activation: silu
normalization: batch_norm
aggregation_method: sum
normalization_factor: 1.0
inv_sublayers: 1
norm_constant: 1.0
sin_embedding: false
no_wandb: true

diffusion_steps: 500
diffusion_noise_schedule: cosine
diffusion_noise_precision: 1.0e-5
diffusion_loss_type: l2

n_epochs: 100
batch_size: 8
accumulate_grad_batches: 2
precision: 16
lr: 5.0e-5
gradient_clip_val: 1.0

lambda_pocket_clash: 1.0
lambda_contact: 0.1
lambda_attach: 1.0
lambda_connectivity: 0.2
lambda_gf: 0.5
bond_class_weights_file: data/crossdocked_pocket10_bond_class_weights.json
corrective_freeze_epochs: 0
pocket_encoder_lr_multiplier: 1.0
bond_head_lr_multiplier: 1.0
rigid_head_lr_multiplier: 1.0
clash_warmup_epochs: 10

save_all_checkpoints: true
checkpoint_every_n_epochs: 10
early_stopping_patience: 0

data_augmentation: false
center_of_mass: fragments
inpainting: false
remove_anchors_context: false
include_charges: true
graph_type: FC
normalize_factors: [1, 4, 1]

checkpoints: checkpoints
logs: logs
log_iterations: 20
test_epochs: 10
enable_progress_bar: true
num_workers: 0
ema_decay: 0.999
